# Telaio in produzione (VPS). Nginx UI raggiunge web sulla rete Docker esterna `proxy`; la porta 3100 resta solo su loopback.
# Non si usa a mano: `deploy/deploy.sh <versione>` pubblica una versione e `deploy/compose.sh` lancia
# docker compose con il file di variabili e la versione corrente. Vedi docs/deploy.md.
#
# Postgres e Redis NON sono qui: Telaio usa quelli condivisi di /opt/infrastructure (container
# `postgres` e `redis` sulla rete esterna `data`), con database `telaio`/utente `telaio_user` e
# utente Redis `telaio` sul db 2 (il db 0 è di Twenty, il 5 di OpenPanel: tutti usano il prefisso `bull`).
#
# Separato dal compose di sviluppo: stesso nome di progetto solo qui (telaio-prod), quindi volumi,
# reti e container non si mescolano con quelli di sviluppo.
name: telaio-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  # Job una tantum: applica le migrazioni prima che parta la nuova versione di web e worker.
  migrate:
    image: ${TELAIO_REGISTRY:-ghcr.io/mattiacapelli}/telaio-worker:${TELAIO_VERSION:?imposta TELAIO_VERSION}
    <<: *hardening
    command: ["node_modules/.bin/tsx", "node_modules/@telaio/db/src/migrate.ts"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?imposta DATABASE_URL in .env.production}
    networks: [data]
    # Job one-shot: il healthcheck ereditato dall'immagine worker non ha senso qui.
    healthcheck:
      disable: true
    logging: *logging

  web:
    image: ${TELAIO_REGISTRY:-ghcr.io/mattiacapelli}/telaio-web:${TELAIO_VERSION:?imposta TELAIO_VERSION}
    <<: *hardening
    restart: unless-stopped
    # Solo loopback: il traffico pubblico arriva da Nginx sull'host (HTTPS).
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?imposta BETTER_AUTH_URL in .env.production}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?imposta BETTER_AUTH_SECRET in .env.production}
      # Codice per la prima configurazione (/setup). Dopo il completamento non serve più.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?imposta REDIS_URL in .env.production}
      TWENTY_API_URL: ${TWENTY_API_URL:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      # Archivio documenti: di norma si configura da Impostazioni → Archiviazione; queste sono il ripiego.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
    # Il proxy Nginx UI raggiunge web tramite l'alias telaio-web sulla rete esterna proxy.
    # data porta a Postgres/Redis/RustFS condivisi; edge consente a web di chiamare servizi esterni.
    networks:
      data: {}
      edge: {}
      proxy:
        aliases:
          - telaio-web
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: ${WEB_MEM_LIMIT:-768m}
    cpus: ${WEB_CPUS:-1.0}
    logging: *logging

  worker:
    image: ${TELAIO_REGISTRY:-ghcr.io/mattiacapelli}/telaio-worker:${TELAIO_VERSION:?imposta TELAIO_VERSION}
    <<: *hardening
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      TWENTY_API_URL: ${TWENTY_API_URL:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${WORKER_BACKUP_KEEP:-7}
    volumes:
      - backups:/backups
    networks: [data, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: ${WORKER_CPUS:-0.5}
    logging: *logging

networks:
  # Rete esterna dei servizi dati condivisi (/opt/infrastructure): postgres, redis, rustfs.
  data:
    external: true
    name: data
  edge: {}
  # Rete esterna già condivisa con il container nginx-ui.
  proxy:
    external: true
    name: proxy

volumes:
  backups:
