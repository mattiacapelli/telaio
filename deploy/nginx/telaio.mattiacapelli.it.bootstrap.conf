# Telaio — bootstrap HTTP per la challenge Let's Encrypt su Nginx UI.
server {
    listen 80;
    server_name telaio.mattiacapelli.it;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "Telaio: configurazione in corso\n";
    }
}
