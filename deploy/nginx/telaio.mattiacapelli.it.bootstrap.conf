# Passo 1 del primo deploy: serve solo a ottenere il certificato Let's Encrypt (challenge HTTP-01).
# Va installato prima della configurazione completa; dopo il certificato si sostituisce con
# telaio.mattiacapelli.it.conf. Vedi docs/deploy.md.
server {
    listen 80;
    listen [::]:80;
    server_name telaio.mattiacapelli.it;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "Telaio: configurazione in corso\n";
    }
}
