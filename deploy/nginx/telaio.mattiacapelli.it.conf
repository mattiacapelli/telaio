# Telaio — https://telaio.mattiacapelli.it
# Virtual host per Nginx UI nel container nginx-ui.
# Il container web ha alias "telaio-web" sulla rete Docker esterna "proxy".
# La risoluzione Docker è dinamica: il file può essere caricato anche prima del primo deploy.
# Challenge e certificato usano il webroot condiviso /var/www.

limit_req_zone $binary_remote_addr zone=telaio_login:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name telaio.mattiacapelli.it;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name telaio.mattiacapelli.it;

    ssl_certificate     /etc/letsencrypt/live/telaio.mattiacapelli.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telaio.mattiacapelli.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:telaio_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # DNS embedded Docker: il nome appare quando il servizio web viene creato.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $telaio_upstream telaio-web;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location ~ ^/api/auth/(sign-in|two-factor|passkey) {
        limit_req zone=telaio_login burst=10 nodelay;
        proxy_pass http://$telaio_upstream:3000;
    }

    location = /setup {
        limit_req zone=telaio_login burst=10 nodelay;
        proxy_pass http://$telaio_upstream:3000;
    }

    location /mcp {
        proxy_pass http://$telaio_upstream:3000;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /sw.js {
        proxy_pass http://$telaio_upstream:3000;
    }

    location ~ ^/api/(progetti|preventivi|clienti)/[0-9a-f-]+/documenti$ {
        client_max_body_size 260m;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://$telaio_upstream:3000;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://$telaio_upstream:3000;
    }

    location / {
        proxy_pass http://$telaio_upstream:3000;
    }
}
