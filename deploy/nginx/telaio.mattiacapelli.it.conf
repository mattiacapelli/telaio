# Telaio — https://telaio.mattiacapelli.it
# Installa SOLO questo file come nuovo virtual host (non toccare gli altri siti del server):
#   sudo cp deploy/nginx/telaio.mattiacapelli.it.conf /etc/nginx/sites-available/telaio.mattiacapelli.it
#   sudo ln -s /etc/nginx/sites-available/telaio.mattiacapelli.it /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Richiede il certificato già emesso (vedi telaio.mattiacapelli.it.bootstrap.conf e docs/deploy.md).
# Se cambi WEB_PORT in .env.production, cambia anche la porta dell'upstream qui sotto.
# Scritto per nginx 1.24 (Ubuntu 24.04): `listen … http2`. Dalla 1.25.1 è deprecato (solo un avviso).

upstream telaio_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Limite ai tentativi di accesso, oltre a quello interno di Better Auth.
limit_req_zone $binary_remote_addr zone=telaio_login:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name telaio.mattiacapelli.it;

    # Il rinnovo di Certbot (webroot) passa da qui.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name telaio.mattiacapelli.it;

    ssl_certificate     /etc/letsencrypt/live/telaio.mattiacapelli.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telaio.mattiacapelli.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:telaio_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Niente includeSubDomains: sullo stesso dominio possono esserci altri siti.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    access_log /var/log/nginx/telaio.access.log;
    error_log  /var/log/nginx/telaio.error.log;

    # Impostazioni di proxy ereditate da tutte le location (che non ridefiniscono proxy_set_header).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Accesso: password, 2FA e passkey.
    location ~ ^/api/auth/(sign-in|two-factor|passkey) {
        limit_req zone=telaio_login burst=10 nodelay;
        proxy_pass http://telaio_web;
    }

    # Server MCP (Streamable HTTP): le risposte in streaming non vanno bufferizzate.
    location /mcp {
        proxy_pass http://telaio_web;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Il Service Worker non deve essere memorizzato: l'intestazione arriva dall'applicazione e passa invariata.
    location = /sw.js {
        proxy_pass http://telaio_web;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://telaio_web;
    }

    location / {
        proxy_pass http://telaio_web;
    }
}
