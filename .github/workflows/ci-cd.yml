# CI/CD di Telaio.
#   pull request → lint, typecheck, test e build delle immagini (senza pubblicarle)
#   push su main o v2 → pubblica le immagini su GHCR (tag = SHA del commit)
#   push su v2 → deploy automatico solo se la variabile di repository DEPLOY_AUTOMATICO=true
# Il primo deploy si esegue con «Deploy manuale»; per disattivare l'autodeploy imposta DEPLOY_AUTOMATICO=false.
name: CI/CD

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifica:
    name: Lint, typecheck e test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Postgres per i test di integrazione (prima configurazione): ognuno crea e poi elimina un database temporaneo.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # la versione di pnpm viene da "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  immagini:
    name: Immagine ${{ matrix.target }}
    needs: verifica
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Nome del registro in minuscolo (GHCR lo richiede)
        run: echo "PROPRIETARIO=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Il build include `next build`: se compila, l'immagine è buona. Sulle PR non si pubblica nulla.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ghcr.io/${{ env.PROPRIETARIO }}/telaio-${{ matrix.target }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  deploy:
    name: Deploy in produzione
    needs: immagini
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2' && vars.DEPLOY_AUTOMATICO == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_deploy.yml
    with:
      versione: ${{ github.sha }}
    secrets: inherit
