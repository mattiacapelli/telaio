services:
  postgres:
    image: postgres:17-alpine
    container_name: telaio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telaio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telaio}
      POSTGRES_DB: ${POSTGRES_DB:-telaio}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telaio} -d ${POSTGRES_DB:-telaio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: telaio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: telaio-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-telaio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-telaio-secret}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telaio-app
    restart: unless-stopped
    profiles: ["app"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-telaio}:${POSTGRES_PASSWORD:-telaio}@postgres:5432/${POSTGRES_DB:-telaio}?schema=public
      REDIS_URL: redis://redis:6379
      TWENTY_API_URL: ${TWENTY_API_URL:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-telaio}
      S3_ACCESS_KEY: ${MINIO_USER:-telaio}
      S3_SECRET_KEY: ${MINIO_PASSWORD:-telaio-secret}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
      SCHEDULER_INTERVALLO: ${SCHEDULER_INTERVALLO:-3600}
      MCP_TOKEN: ${MCP_TOKEN:-}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
