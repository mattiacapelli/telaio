# Servizi di sviluppo: immagini e tag come da ~/Sviluppo/CLAUDE.md
name: telaio

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: telaio
      POSTGRES_PASSWORD: telaio
      POSTGRES_DB: telaio
    ports:
      - "5432:5432"
    volumes:
      - telaio_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telaio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - telaio_redisdata:/data

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  telaio_pgdata:
  telaio_redisdata:
