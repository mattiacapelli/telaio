# Servizi di sviluppo: immagini e tag come da ~/Sviluppo/CLAUDE.md
name: telaio

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: telaio
      POSTGRES_PASSWORD: telaio
      POSTGRES_DB: telaio
    ports:
      - "5433:5432"
    volumes:
      - telaio_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telaio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - telaio_redisdata:/data

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1026:1025"
      - "8026:8025"

  # ── App (profilo "app"): `docker compose --profile app up --build` ─────────────────────────────
  # Prova locale delle immagini di produzione (stesso Dockerfile, target web e worker); la migrazione
  # usa l'immagine del worker. Per la produzione vera vedi docker-compose.prod.yml e docs/deploy.md.
  migrate:
    profiles: ["app"]
    build: { context: ., target: worker }
    image: telaio-worker
    command: ["node_modules/.bin/tsx", "node_modules/@telaio/db/src/migrate.ts"]
    environment: &app_env
      DATABASE_URL: postgres://telaio:telaio@postgres:5432/telaio
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      BETTER_AUTH_URL: http://localhost:3000
    env_file: [{ path: .env, required: false }]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    profiles: ["app"]
    build: { context: ., target: web }
    image: telaio-web
    environment: *app_env
    env_file: [{ path: .env, required: false }]
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:
    profiles: ["app"]
    image: telaio-worker
    environment:
      <<: *app_env
      BACKUP_DIR: /backups
    env_file: [{ path: .env, required: false }]
    volumes:
      - telaio_backups:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

volumes:
  telaio_backups:
  telaio_pgdata:
  telaio_redisdata:
